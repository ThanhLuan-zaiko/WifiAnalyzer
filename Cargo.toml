[workspace]
members = [
    "crates/wifi-cli",
    "crates/wifi-core",
    "crates/wifi-ffi",
    "crates/wifi-scanner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
pyo3 = "0.27.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["serde", "v4"] }
wifi-core = { path = "crates/wifi-core" }
wifi-scanner = { path = "crates/wifi-scanner" }
